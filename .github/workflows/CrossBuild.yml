name: Cross-Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Squeezelite-ESP32
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Set build environment
        run: |
          echo "TARGET_BUILD_NAME=Squeezelite-S3" >> $GITHUB_ENV
          echo "BUILD_NUMBER=1" >> $GITHUB_ENV
          echo "DEPTH=16" >> $GITHUB_ENV

      - name: Pull ESP-IDF Docker
        run: docker pull sle118/idf:release-v4.4

      - name: Build firmware
        run: |
          echo "TARGET_BUILD_NAME=${TARGET_BUILD_NAME}" > build-env.txt
          docker run --rm -v $PWD:/project -w /project --env-file build-env.txt sle118/idf:release-v4.4 /bin/bash -c "
            cp build-scripts/Squeezelite-S3-sdkconfig.defaults sdkconfig || true
            idf.py build -DDEPTH=${DEPTH} -DBUILD_NUMBER=${BUILD_NUMBER}
          "

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: squeezelite-esp32s3
          path: |
            build/squeezelite.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
