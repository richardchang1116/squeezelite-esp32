name: Cross-Build ESP32-S3

on:
  workflow_dispatch:
  push:
    branches:
      - 'master-cmake'
  pull_request:
    branches:
      - 'master-cmake'

jobs:
  job1:
    name: Build Number
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.buildnumber.outputs.build_number }}
    steps:
    - name: Generate build number
      id: buildnumber
      uses: einaregilsson/build-number@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: job1
    strategy:
      matrix:
        node: [I2S-4MFlash, SqueezeAmp, Muse]
        depth: [16]
    steps:
    - name: Set environment
      run: |
        echo "TARGET_BUILD_NAME=${{ matrix.node }}" >> $GITHUB_ENV
        echo "BUILD_NUMBER=${{ needs.job1.outputs.build_number }}" >> $GITHUB_ENV
        echo "IDF_TARGET=esp32s3" >> $GITHUB_ENV
        echo "ESP32S3_PSRAM=16" >> $GITHUB_ENV  # 改成 8 如果你板子是 8MB

    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: Cache build
      id: cache-build
      uses: actions/cache@v4
      with:
        path: |
          build
        key: ${{ runner.os }}-${{ matrix.node }}-${{ matrix.depth }}

    - name: Build firmware
      run: |
        docker pull sle118/idf:release-v4.4
        env | grep "TARGET_BUILD_NAME\|BUILD_NUMBER\|IDF_TARGET" >${TARGET_BUILD_NAME}-env.txt
        docker run --env-file=${TARGET_BUILD_NAME}-env.txt \
          -v $PWD:/project -w /project sle118/idf:release-v4.4 \
          /bin/bash -c "\
          cp build-scripts/${TARGET_BUILD_NAME}-sdkconfig.defaults sdkconfig && \
          idf.py build -DDEPTH=${{ matrix.depth }} -DBUILD_NUMBER=${BUILD_NUMBER}-${{ matrix.depth }} && \
          zip -r build_output.zip build && \
          zip build/${T
