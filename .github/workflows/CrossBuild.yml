name: Squeezelite-ESP32 Build for ESP32-S3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.11"

      - name: Install ESP-IDF
        run: |
          git clone -b v4.4 --recursive https://github.com/espressif/esp-idf.git
          cd esp-idf
          ./install.sh esp32s3

      - name: Build Squeezelite for ESP32-S3
        run: |
          . ./esp-idf/export.sh
          cd squeezelite-esp32
          idf.py set-target esp32s3
          idf.py build
