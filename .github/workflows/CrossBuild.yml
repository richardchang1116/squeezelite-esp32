name: Cross-Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        idf_ver: [v4.4.4]
        target: [esp32s3]
        flash: [4MFlash]
        partition: [16]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: ${{ runner.os }}-espidf-${{ matrix.idf_ver }}
          restore-keys: |
            ${{ runner.os }}-espidf-

      - name: Install ESP-IDF
        run: |
          git clone -b release/${{ matrix.idf_ver }} --recursive https://github.com/espressif/esp-idf.git ~/esp-idf
          ~/esp-idf/install.sh

      - name: Build firmware
        run: |
          . ~/esp-idf/export.sh
          idf.py set-target ${{ matrix.target }}
          idf.py build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: squeezelite-${{ matrix.target }}-${{ matrix.flash }}-${{ matrix.partition }}
          path: build/*.bin
